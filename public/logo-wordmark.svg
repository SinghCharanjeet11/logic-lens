<svg width="180" height="40" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logic (neutral dark) -->
  <text x="0" y="28" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#1e293b" letter-spacing="-0.02em">Logic</text>
  
  <!-- Lens (indigo/purple gradient) -->
  <defs>
    <linearGradient id="lensGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  <text x="82" y="28" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="url(#lensGradient)" letter-spacing="-0.02em">Lens</text>
  
  <!-- Subtle lens icon accent (right side) -->
  <circle cx="165" cy="20" r="12" stroke="url(#lensGradient)" stroke-width="2.5" fill="none" opacity="0.8"/>
  <circle cx="165" cy="20" r="4" fill="url(#lensGradient)" opacity="0.6"/>
</svg>
